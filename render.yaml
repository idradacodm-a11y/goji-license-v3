services:
  - type: web
    name: goji-license
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn goji_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --log-level debug
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_PASS
        sync: false
      - key: OWNER_HANDLE
        value: "@Goji_Pogi"
      - key: BRAND
        value: "GOJI"
      - key: HMAC_SALT
        value: "goji-warpshield-2026"