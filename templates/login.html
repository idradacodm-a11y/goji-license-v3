<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ brand }} · login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}"></head>
<body class="auth-body">
<div class="aurora"></div>
<div class="auth-wrap"><div class="auth-card">
  <div class="logo-mark">◆</div>
  <h1 class="logo-title">{{ brand }}</h1>
  <p class="logo-sub">OWNER PANEL</p>
  <form method="post" autocomplete="off">
    <label class="field"><span class="field-label">Password</span>
    <input name="pw" type="password" autofocus required></label>
    <button type="submit" class="btn-primary">Enter</button>
    {% if err %}<p class="err">✗ {{ err }}</p>{% endif %}
  </form>
  <p class="foot">{{ brand }} · V3</p>
</div></div></body></html>
